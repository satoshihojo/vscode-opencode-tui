name: CI

on:
  push:
    tags-ignore:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      generate_recording_media:
        description: Run the recording/media generation step
        required: false
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg libgtk-3-0 libnss3 libasound2t64 libxss1 libgbm1 libxshmfence1 libatk-bridge2.0-0 libdrm2 libxkbcommon0

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Generate review workflow media
        if: github.event_name == 'workflow_dispatch' && inputs.generate_recording_media
        run: npm run test:recording

      - name: Package extension
        run: npm run package

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: opencode-tui-integration-artifacts
          path: |
            docs/media/review-queue-workflow.gif
            *.vsix

  workflow-review:
    runs-on: ubuntu-latest
    needs:
      - verify
      - smoke-macos
      - smoke-windows
    if: always()

    steps:
      - name: Confirm required workflow jobs passed
        uses: actions/github-script@v9
        with:
          script: |
            const results = {
              verify: "${{ needs.verify.result }}",
              smokeMacos: "${{ needs.smoke-macos.result }}",
              smokeWindows: "${{ needs.smoke-windows.result }}",
            }
            const failed = Object.entries(results).filter(([, result]) => result !== "success")
            if (failed.length > 0) {
              core.setFailed(`Required jobs failed: ${failed.map(([name, result]) => `${name}=${result}`).join(", ")}`)
            }

  smoke-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Type check
        run: npm run check-types

      - name: Unit tests
        run: npm test

      - name: Package extension
        run: npm run package

  smoke-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Type check
        run: npm run check-types

      - name: Unit tests
        run: npm test

      - name: Package extension
        run: npm run package
